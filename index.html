<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>sistema de préstamo de materiales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1d2733;
    }

    header {
      background: #173b67;
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 6px solid #c7a64a;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 18px;
    }

    main {
      width: 92%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .contenido {
      padding: 30px;
    }

    .contenido h2 {
      margin-top: 0;
      color: #173b67;
      font-size: 30px;
    }

    .contenido p {
      line-height: 1.6;
      font-size: 17px;
    }

    footer {
      text-align: center;
      color: #65717e;
      padding: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Sistema de préstamo de materiales</h1>
    <p>Biblioteca · FES Acatlán</p>
  </header>

  <main>
    <section class="card">

      <img
        src="biblioteca.png"
        alt="Biblioteca de la FES Acatlán"
      >

      <div class="contenido">
        <h2>Préstamo de materiales</h2>

        <p>
          Página inicial del prototipo del sistema de préstamo
          de materiales de biblioteca.
        </p>
      </div>

    </section>
  </main>

  <footer>
    Flores González Jonathan Alexis · Ingeniería de Software
  </footer>

</body>
</html>
